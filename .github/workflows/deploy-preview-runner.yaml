name: Deploy Preview Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "k8s/runner/**"
      - "k8s/infra/runner-pool.yaml"
      - ".github/workflows/deploy-preview-runner.yaml"

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: itzmohit96/promptic-preview-runner

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./k8s/runner
          push: true
          tags: |
            docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker.io/${{ env.IMAGE_NAME }}:latest
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GCP_CLUSTER }}
          location: ${{ secrets.GCP_ZONE }}
      - name: Roll out runner pool
        run: |
          kubectl apply -f k8s/infra/runner-pool.yaml
          kubectl set image deployment/runner-pool runner=docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }} -n promptic-previews
          kubectl rollout status deployment/runner-pool -n promptic-previews
