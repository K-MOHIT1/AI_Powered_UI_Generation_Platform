name: Apply Preview Runner Pool

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "k8s/infra/runner-pool.yaml"
      - ".github/workflows/deploy-preview-runner.yaml"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GCP_CLUSTER }}
          location: ${{ secrets.GCP_ZONE }}
      - name: Roll out runner pool
        run: |
          kubectl apply -f k8s/infra/runner-pool.yaml
          kubectl rollout status deployment/runner-pool -n promptic-previews
