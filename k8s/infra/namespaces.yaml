# k8s/infra/namespace.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: promptic-core

---
# to create a separate ns for previews

apiVersion: v1
kind: Namespace
metadata:
  name: promptic-previews

---
# configmap for shared config values across services

apiVersion: v1
kind: ConfigMap
metadata:
  name: promptic-shared-config
  namespace: promptic-core
data:
  PREVIEW_DOMAIN: "previews.promptic.site"
  PREVIEW_NAMESPACE: "promptic-previews"
  PROXY_PORT: "80"
  APP_FRONTEND_URL: "https://promptic.site"

